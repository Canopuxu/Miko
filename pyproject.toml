[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "miko-local"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "psutil==7.2.2",
  "frida==17.24.1",
  "deepseek-harness-sdk==0.1.5rc1",
  "deepseek-harness-runtime-bin==0.1.5rc1",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "Pillow==12.3.0",
  "jieba==0.42.1",
  "memu-cli==0.11.0b3",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where = ["apps/backend/src"]

[tool.setuptools.package-data]
"miko.storage" = ["migrations/*.sql", "profile-categories.json"]
"miko.adapters.memory.memobase_upstream" = ["LICENSE", "source-manifest.json"]
"miko.adapters.life" = ["LICENSE", "source-manifest.json"]
