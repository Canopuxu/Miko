[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "miko-local"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "psutil==7.2.2",
  "deepseek-harness-sdk==0.1.5rc1",
  "deepseek-harness-runtime-bin==0.1.5rc1",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "Pillow==12.3.0",
  "jieba==0.42.1",
  "memu-cli==0.11.0b3",
]

[tool.setuptools.packages.find]
where = ["apps/backend/src"]

[tool.setuptools.package-data]
"miko.storage" = ["migrations/*.sql"]
